{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block body %}
<main class="auth"><div class="card auth-card">
  <span class="chip">WELCOME BACK</span>
  <h1>Sign <span class="grad-text">in</span></h1>
  <p class="sub">Access your dashboard and scan history.</p>
  <form method="post">
    <div class="field"><label>USERNAME</label><input name="name" required autofocus placeholder="your username"></div>
    <div class="field"><label>PASSWORD</label><div class="pw"><input type="password" name="password" required placeholder="••••••••"><button type="button">👁</button></div></div>
    <button class="btn">Login →</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></main>
{% endblock %}
